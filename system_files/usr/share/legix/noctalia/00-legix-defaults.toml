# Legix image defaults for Noctalia. Your own *.toml files here and the
# Settings UI override these. This file is refreshed from the image each time
# Noctalia starts; to stop that, create ~/.config/noctalia/.legix-no-defaults
# (and delete this file).

# Full-width bar, square ends.
[bar.default]
margin_ends = 0
# Noctalia's default right-hand widgets, plus the on-screen keyboard ("osk")
# for using the Go without a physical keyboard.
end = [
    "media",
    "tray",
    "notifications",
    "clipboard",
    "osk",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session",
]
radius = 0
radius_top_left = 0
radius_top_right = 0
radius_bottom_left = 0
radius_bottom_right = 0

# The media widget otherwise shows "Nothing playing" under the clock on the
# Go's narrow 1024px-wide logical screen.
[widget.media]
type = "media"
hide_when_no_media = true

# On-screen keyboard: the community "Keyboard" plugin (omerfuyar/keyboard).
# Its OSK is a Noctalia layer that never takes focus and types into the
# focused window with wtype (installed in the image). Tap the bar widget,
# then "On-screen keyboard". Its layout list comes from Hyprland, so on niri
# it only lists fcitx5 input methods (none installed); the OSK itself works.
[plugins]
enabled = [ "omerfuyar/keyboard" ]

[widget.osk]
type = "omerfuyar/keyboard:widget"

# Icons only, except the battery, which keeps its percentage.
[widget.network]
type = "network"
show_label = false
show_glyph = true

[widget.volume]
type = "volume"
show_label = false
show_glyph = true

[widget.brightness]
type = "brightness"
show_label = false
show_glyph = true

[widget.battery]
type = "battery"
show_label = true
show_glyph = true

# Desk security (LFORGE-15/18): Noctalia's own lock screen, which has an
# on-screen keyboard (lockscreen.keyboard, from noctalia-osk), so it can be
# unlocked without a physical keyboard. It locks before suspend and after
# 5 min idle. "Gaming Mode (Steam PIN)" replaces Logout, which went to
# Gaming Mode anyway.
[lockscreen]
lock_before_suspend = true
keyboard = "auto"

[idle]
behavior_order = [ "lock", "away", "screen-off", "lock-and-suspend" ]

[idle.behavior.lock]
action = "lock"
enabled = true
timeout = 300.0

[idle.behavior.away]
action = "command"
command = "/usr/libexec/legix-away"
enabled = false
timeout = 300.0

[idle.behavior.lock-and-suspend]
action = "lock_and_suspend"
enabled = false

# Noctalia's password prompt for admin actions (Disks, Firewall, Bazaar...).
# niri has no other polkit agent since GNOME was removed.
[shell]
polkit_agent = true

[[shell.session.actions]]
action = "lock"
shortcut = "1"

[[shell.session.actions]]
action = "logout"
command = "/usr/libexec/legix-away"
label = "Gaming Mode (Steam PIN)"
shortcut = "2"

[[shell.session.actions]]
action = "suspend"
label = "Lock and suspend"
shortcut = "3"

[[shell.session.actions]]
action = "reboot"
shortcut = "4"

[[shell.session.actions]]
action = "shutdown"
shortcut = "5"
variant = "destructive"

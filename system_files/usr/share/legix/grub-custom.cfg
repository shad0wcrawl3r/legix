# Legix: hide the boot menu after a good boot. Installed by legix-grub-autohide.
# bootupd's static grub.cfg has no menu_auto_hide support, and its greenboot
# section resets boot_success before this file runs. So Legix keeps its own
# flag: legix-grub-autohide sets legix_menu_hide=1 at a clean shutdown once the
# boot has been marked successful (grub-boot-success.timer, 2 minutes into the
# user session), and it is cleared here on every boot. After a crash, a failed
# boot or a very short session, the menu shows. A one-off menu request
# (menu_show_once_timeout) still shows it. Hold Esc while booting to show it anyway.
if [ "${legix_menu_hide}" = "1" -a "${timeout}" = "1" ]; then
  set timeout_style=hidden
fi
set legix_menu_hide=0
save_env legix_menu_hide
